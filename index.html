<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Last World War</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Last World War">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141622">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./minigames/minigames.css">
<link rel="stylesheet" href="./boss/boss.css">
</head>
<body>
<section id="title" class="screen on"><div id="title-root"></div></section>

<section id="who" class="screen">
  <h1>Who is playing?</h1>
  <button id="cloud" class="grey" aria-label="Parents">☁</button>
  <div id="fs-tip" hidden>Full screen: tap Share, then “Add to Home Screen”</div>
  <div id="who-list"></div>
</section>

<section id="map" class="screen">
  <iframe id="map-frame" title="Karta"></iframe>
  <div id="map-bar">
    <button id="b-gear"><canvas id="b-gear-c" width="24" height="24"></canvas><span>Gear</span><em id="gear-dot" hidden></em></button>
    <button id="b-book"><canvas id="b-book-c" width="24" height="24"></canvas><span>Book</span></button>
    <button id="b-shop"><canvas id="b-shop-c" width="24" height="24"></canvas><span>Shop</span><em id="shop-dot" hidden></em></button>
    <button id="b-who"><canvas id="b-who-c" width="40" height="24" class="wide"></canvas><span>Players</span></button>
    <div id="me"><b id="me-name"></b><i id="me-title"></i><span>Level <b id="me-level"></b></span><div class="bar"><i id="me-xp"></i></div></div>
  </div>
</section>

<section id="parent" class="screen">
  <header><button id="parent-back">◀ Tillbaka</button><h2>För föräldrar: spara och synka</h2></header>
  <div id="parent-box"></div>
</section>

<section id="battle" class="screen"><div id="battle-root"></div></section>

<section id="mini" class="screen">
  <header><button class="back" id="mini-back">◀ Map</button><h2 id="mini-title"></h2></header>
  <div id="mini-root"></div>
</section>

<section id="gear" class="screen">
  <header><button class="back">◀ Map</button><h2>Gear</h2><div class="sparks" id="sparks" aria-label="Sparks to use"><i class="spark"></i><b id="pts">0</b></div><div class="wallet"><span class="coin"></span><b class="gold"></b></div></header>
  <div class="cols">
    <div class="stage gearstage">
      <div class="doll">
        <div class="slotcol" id="gs-left"></div>
        <div class="portrait"><canvas id="gear-bg"></canvas><canvas id="gear-hero"></canvas></div>
        <div class="slotcol" id="gs-right"></div>
      </div>
      <!-- Fliken Powers (skillträdet): provscenen i stället för porträttet, rutan om valt steg, och trädet i väskans ruta -->
      <div class="scene-row" id="pw-scene">
        <div class="scene-wrap"><canvas id="pw-bg"></canvas><canvas id="pw-canvas"></canvas><div id="pw-tag" hidden>Trying</div><div id="pw-banner" class="banner"></div></div>
        <div class="try"><button id="pw-attack" aria-label="Attack">⚔</button><button id="pw-super" aria-label="Super attack">★</button><button id="pw-win" aria-label="Win pose">🏆</button></div>
      </div>
      <div class="plate"><b id="g-name"></b><i id="g-title"></i><span id="g-level"></span><div class="bar"><i id="g-xp"></i></div><small id="pw-next"></small></div>
      <div id="gear-stats"></div>
      <div id="pw-info"></div>
    </div>
    <div class="bag"><div id="bag-tabs"></div><h3 id="bag-title"></h3><div id="gear-grid"></div><div id="gear-sheet" hidden></div><div id="tree-wrap"><div id="tree"></div></div></div>
  </div>
</section>

<section id="book" class="screen">
  <header><button class="back">◀ Map</button><h2>My Word Book</h2><div class="wallet" id="book-count"></div></header>
  <div id="book-legend"></div>
  <div id="book-meter" hidden></div>
  <div id="book-pages"></div>
  <div id="book-sheet" hidden></div>
</section>

<section id="shop" class="screen">
  <header><button class="back">◀ Map</button><h2>Today's shop</h2><div class="wallet"><span class="coin"></span><b class="gold"></b></div></header>
  <div class="cols">
    <div class="stage"><canvas id="shop-hero"></canvas><div id="shop-try"></div></div>
    <div class="bag"><div id="shop-list"></div><p id="shop-note">New items tomorrow!</p></div>
  </div>
</section>

<div id="result" hidden><div class="box"><h2></h2><div class="sv"></div><div class="stars"></div><p class="lines"></p><div class="acts"></div></div></div>
<div id="toast"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
